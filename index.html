<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1826">
<title>Flightlog</title>
<!-- FAVICON: active icon is favicon.svg. To switch, copy any file from /favicons/ over
     favicon.svg (or just change the href below to point at a different one). -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body data-auth="viewer">

<div class="shell">

  <header class="topbar">
    <div class="brand-block">
      <span class="lamp" id="lamp" title="Cloud sync status"></span>
      <span class="brand">Flightlog</span>
    </div>

    <nav class="tabs" id="tabs" aria-label="Sections">
      <button class="tab active" data-tab="dashboard">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="tab" data-tab="sva">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 3 10l7 3 3 7z"/><path d="M10 13 21 3"/></svg>
        <span><span class="full">Southwest Virtual</span><span class="short">SVA</span></span>
      </button>
      <button class="tab" data-tab="add">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        <span><span class="full">Log flight</span><span class="short">Log</span></span>
      </button>
      <button class="tab" data-tab="logbook">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
        <span>Logbook</span>
      </button>
      <button class="tab" data-tab="data">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
        <span>Data</span>
      </button>
    </nav>

    <div class="topbar-end">
      <div class="utc-clock" id="utcClock" aria-label="Current UTC time">
        <span class="utc-time"><span id="utcTime"></span><span class="utc-label">UTC</span></span>
        <span class="utc-date" id="utcDate"></span>
      </div>
      <button class="lock-btn" id="lockBtn" type="button" title="Log in as admin to add or change flights" aria-label="Log in">
        <svg class="ico ico-in" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
        <svg class="ico ico-out" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        <span class="lock-text">Log in</span>
      </button>
    </div>
  </header>

  <main id="view"></main>

  <footer class="statusbar" role="status" aria-live="polite">
    <span id="statusLeft">Standby</span>
    <span id="statusRight"></span>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<template id="tpl-dashboard">
  <section class="page">
    <div class="hero">
      <div class="hobbs-block">
        <span class="hobbs-label">Total time</span>
        <div class="hobbs" id="dash-hobbs" role="img" aria-label="Total time"></div>
        <span class="hobbs-unit">hours</span>
      </div>
      <dl class="facts" id="dash-facts"></dl>
    </div>

    <h2 class="section-title">Landings</h2>
    <div class="spread" id="dash-spread"></div>
    <dl class="ledger" id="dash-ledger"></dl>

    <div class="panel-grid">
      <section class="panel">
        <header class="panel-head"><h3>Landing rate</h3><p>Feet per minute at touchdown</p></header>
        <div class="chart-box"><canvas id="chartRate"></canvas></div>
        <div class="key">
          <span><i class="dot dot-steel"></i>Normal</span>
          <span><i class="dot dot-accent"></i>Notes attached</span>
          <span><i class="dot dot-rose"></i>Excluded (PM landing)</span>
          <span><i class="dot dot-band"></i>Smooth zone, under 150 fpm</span>
        </div>
      </section>

      <section class="panel">
        <header class="panel-head"><h3>Landing G</h3><p>Vertical load at touchdown</p></header>
        <div class="chart-box"><canvas id="chartG"></canvas></div>
      </section>

      <section class="panel span-2">
        <header class="panel-head"><h3>Hours by month</h3><p>Time flown in each calendar month</p></header>
        <div class="chart-box short"><canvas id="chartHours"></canvas></div>
      </section>

      <section class="panel">
        <header class="panel-head"><h3>Aircraft types</h3><p>Share of all flights</p></header>
        <div class="pie-wrap">
          <div class="pie-box"><canvas id="chartAircraft"></canvas></div>
          <ul class="chart-legend" id="aircraftLegend"></ul>
        </div>
      </section>

      <section class="panel">
        <header class="panel-head"><h3>Airports</h3><p>Departures and arrivals combined</p></header>
        <div id="airportTable"></div>
      </section>
    </div>
  </section>
</template>

<template id="tpl-sva">
  <section class="page">
    <div class="hero">
      <div class="hobbs-block">
        <span class="hobbs-label">Southwest Virtual time</span>
        <div class="hobbs" id="sva-hobbs" role="img" aria-label="Southwest Virtual time"></div>
        <span class="hobbs-unit">hours</span>
      </div>
      <dl class="facts" id="sva-facts"></dl>
    </div>

    <h2 class="section-title">Landings</h2>
    <div class="spread" id="sva-spread"></div>
    <dl class="ledger" id="sva-ledger"></dl>

    <div class="panel-grid">
      <section class="panel span-2">
        <header class="panel-head"><h3>TFP over time</h3><p>Running total of TFP hours</p></header>
        <div class="chart-box"><canvas id="chartTFP"></canvas></div>
      </section>

      <section class="panel">
        <header class="panel-head"><h3>Seniority</h3><p>Average landing by rank</p></header>
        <div class="table-scroll" id="svaRankTable"></div>
      </section>

      <section class="panel">
        <header class="panel-head"><h3>Destinations</h3><p>Southwest Virtual airports</p></header>
        <div id="svaAirportTable"></div>
      </section>
    </div>
  </section>
</template>

<template id="tpl-signin">
  <section class="form-wrap">
    <form class="panel signin-card" id="signinForm" novalidate>
      <h3 class="lock-title">Admin login</h3>
      <p class="hint">Log in to add or change flights. Everyone else can view the logbook without logging in.</p>
      <label>Username
        <input id="si-user" autocomplete="username" autocapitalize="none" spellcheck="false">
      </label>
      <label>Password
        <input id="si-pass" type="password" autocomplete="current-password">
      </label>
      <p class="hint" id="signinMsg" aria-live="polite"></p>
      <div class="form-actions">
        <button class="btn-primary" id="signinBtn" type="submit">Log in</button>
        <button class="btn-ghost" id="signinCancel" type="button">Cancel</button>
      </div>
    </form>
  </section>
</template>

<template id="tpl-add">
  <section class="form-wrap">
    <form class="panel form-card" id="flightForm">
      <header class="panel-head"><h3>Log a flight</h3><p>Fill in the flight, then save it to your logbook.</p></header>

      <h4 class="form-group">Route</h4>
      <div class="grid-2 pair">
        <label>Departure<input required maxlength="4" id="f-dep" placeholder="KHOU" class="upper"></label>
        <label>Arrival <input required maxlength="4" id="f-arr" placeholder="KDAL" class="upper"></label>
      </div>
      <div class="grid-2 pair">
        <label>Flight number<input required id="f-flightnum" placeholder="SWA20" class="upper"></label>
        <label>Aircraft <input required id="f-aircraft" placeholder="B738" class="upper" maxlength="6"></label>
      </div>

      <h4 class="form-group">Time</h4>
      <div class="grid-2 pair">
        <label>Date<input required type="date" id="f-date"></label>
        <label>Elapsed (hours) <input required type="number" inputmode="decimal" step="0.1" min="0" id="f-elapsed"></label>
      </div>

      <h4 class="form-group">Landing</h4>
      <div class="grid-2 pair">
        <label>Rate (fpm)<input required type="number" inputmode="decimal" step="0.1" id="f-landingrate" placeholder="-307.6"></label>
        <label>G force <input required type="number" inputmode="decimal" step="0.01" min="0" id="f-landingg" placeholder="1.59"></label>
      </div>

      <label class="check"><input type="checkbox" id="f-shared"> Shared cockpit</label>

      <div class="grid-2 shared-only hidden" id="sharedFields">
        <label>Role this leg
          <select id="f-role">
            <option value="">Choose a role</option>
            <option value="PF TO/PF LDG">PF takeoff, PF landing</option>
            <option value="PF TO/PM LDG">PF takeoff, PM landing</option>
            <option value="PM TO/PF LDG">PM takeoff, PF landing</option>
            <option value="PM TO/PM LDG">PM takeoff, PM landing</option>
          </select>
        </label>
        <label>Averages
          <span class="check inline-check"><input type="checkbox" id="f-exclude"> Leave out of averages (set automatically for PM landings)</span>
        </label>
      </div>

      <hr class="divider">

      <label class="check sva-toggle"><input type="checkbox" id="f-issva"> Count toward Southwest Virtual</label>

      <div class="grid-2 sva-only hidden" id="svaFields">
        <label>TFP (hours) <input type="number" inputmode="decimal" step="0.01" min="0" id="f-tfp" placeholder="1.0"></label>
        <label>Seniority rank
          <select id="f-rank">
            <option value="">Choose a rank</option>
            <option>NEW HIRE</option>
            <option>IOE PILOT</option>
            <option>JUNIOR FIRST OFFICER</option>
            <option>FIRST OFFICER</option>
            <option>SENIOR FIRST OFFICER</option>
          </select>
        </label>
      </div>

      <label class="full">Notes <textarea id="f-notes" rows="2" placeholder="Manual report, windshear on final"></textarea></label>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Save flight</button>
        <button type="reset" class="btn-ghost">Reset form</button>
      </div>
    </form>
  </section>
</template>

<template id="tpl-logbook">
  <section class="page">
    <section class="panel logbook-panel">
      <header class="panel-head">
        <h3>Logbook</h3>
        <p id="logCount">&nbsp;</p>
      </header>
      <div class="filter-row">
        <select id="filterSheet" aria-label="Flight type">
          <option value="all">All flights</option>
          <option value="sva">Southwest Virtual only</option>
          <option value="general">General only</option>
        </select>
        <select id="filterRank" aria-label="Rank">
          <option value="all">All ranks</option>
        </select>
        <select id="filterAircraft" aria-label="Aircraft">
          <option value="all">All aircraft</option>
        </select>
        <select id="filterAirport" aria-label="Airport">
          <option value="all">All airports</option>
        </select>
        <input id="filterSearch" type="search" placeholder="Search airport or flight number" aria-label="Search">
        <button class="btn-ghost" id="clearFilters" type="button">Clear filters</button>
      </div>
      <p class="rate-key" id="rateKey">
        <span><i class="sw sw-smooth"></i>Smooth, under 150 fpm</span>
        <span><i class="sw sw-firm"></i>Firm, over 350</span>
        <span><i class="sw sw-hard"></i>Hard, over 500</span>
      </p>
      <div id="logbookTable"></div>
    </section>
  </section>
</template>

<template id="tpl-data">
  <section class="page narrow">
    <section class="panel">
      <header class="panel-head row-between">
        <div><h3>Cloud sync</h3><p>Saves this logbook online and loads it on other devices</p></div>
        <span class="sync-pill" id="syncPill">Ready</span>
      </header>
      <p class="hint">Anyone can view the logbook without logging in. Only you can save changes, and only while logged in as admin.</p>
      <div class="form-actions">
        <button class="btn-primary" id="syncNow" type="button">Sync now</button>
      </div>
      <p class="hint" id="syncStatus"></p>
    </section>

    <section class="panel">
      <header class="panel-head"><h3>Import a spreadsheet</h3><p>LOGBOOK.xlsx or SVA_FLIGHT_TRACKER.xlsx</p></header>
      <p class="hint">Columns are detected automatically (DEP, ARR, FLIGHT #, DATE, ELAPSED, TFP, LANDING R, LANDING G, AIRCRAFT, NOTES). A RANK PROGRESS sheet, if present, sets each flight's seniority rank. Shared cockpit flights are flagged from the notes text, so review them after importing.</p>
      <input type="file" id="importFile" accept=".xlsx,.xls">
      <div id="importStatus" class="hint"></div>
    </section>

    <section class="panel">
      <header class="panel-head"><h3>Backup and export</h3><p>Works offline, separate from cloud sync</p></header>
      <p class="hint">Export a JSON backup regularly, or use it to move your logbook to another device.</p>
      <div class="form-actions">
        <button class="btn-primary" id="exportJson">Export JSON</button>
        <button class="btn-ghost" id="exportCsv">Export CSV</button>
        <button class="btn-ghost" id="exportPdf">Export PDF</button>
        <label class="btn-ghost file-btn">Restore JSON<input type="file" id="restoreFile" accept=".json" hidden></label>
      </div>
      <hr class="divider">
      <button class="btn-danger" id="wipeData">Erase all data on this device</button>
    </section>
  </section>
</template>

<script src="vendor/chart.umd.js"></script>
<script src="vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="script.js"></script>
</body>
</html>
