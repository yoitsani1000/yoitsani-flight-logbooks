<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="12" fill="#0a0d10"/>
  <!-- book cover -->
  <rect x="14" y="12" width="36" height="42" rx="2" fill="#ffb000"/>
  <!-- page edges -->
  <rect x="17" y="15" width="30" height="36" rx="1" fill="#1a1200"/>
  <!-- spine highlight -->
  <rect x="14" y="12" width="6" height="42" rx="2" fill="#8a6107"/>
  <!-- ruled lines suggesting log entries: fewer, thicker, more spaced for legibility at small sizes -->
  <line x1="25" y1="26" x2="41" y2="26" stroke="#ffb000" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="25" y1="34" x2="41" y2="34" stroke="#ffb000" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="25" y1="42" x2="35" y2="42" stroke="#ffb000" stroke-width="2.6" stroke-linecap="round"/>
</svg>
